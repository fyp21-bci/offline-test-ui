version: "3.9"

services:
  server:
    build: ./server
    container_name: server
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    restart: unless-stopped

  client:
    build: ./client
    container_name: client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    restart: unless-stopped